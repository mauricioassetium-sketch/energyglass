name: lucide-all-once
on:
  push:
    paths:
      - '.github/workflows/lucide-all.yml'
permissions:
  contents: write
jobs:
  lucide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install lucide-static
        run: npm install --no-save lucide-static@0.460.0
      - name: swap emoji for lucide svg
        run: |
          python3 - <<'PY'
          import re, os
          # (archivo, clave_del_h3, nombre_lucide)
          MAP = [
            ('aplicaciones.html', 'Batería',           'battery-charging'),
            ('aplicaciones.html', 'Conexión a red',    'plug'),
            ('aplicaciones.html', 'Corriente continua / LED', 'lightbulb'),
            ('defensa.html', 'Desastres naturales',    'cloud-lightning'),
            ('defensa.html', 'Balística',              'target'),
            ('defensa.html', 'Explosión',              'bomb'),
            ('defensa.html', 'Incendios',              'shield-alert'),
            ('defensa.html', 'Intrusión forzada',      'door-open'),
            ('defensa.html', 'Institucional',          'landmark'),
            ('fabricacion.html', 'Vidrios de 6 mm',    'layers'),
            ('fabricacion.html', 'Film de unión patentado', 'link'),
            ('fabricacion.html', 'Laminado y sellado', 'package'),
            ('ip.html', 'Fórmula del interlayer',      'flask-conical'),
            ('ip.html', 'Film de unión',               'link'),
            ('ip.html', 'Colectores de borde',         'zap'),
            ('ip.html', 'Documentación',               'file-text'),
            ('tecnologia.html', 'Dos vidrios, una película', 'layers'),
            ('tecnologia.html', 'Guía hacia el borde', 'route'),
            ('tecnologia.html', 'Colectores de borde', 'zap'),
          ]
          ICON_DIR = 'node_modules/lucide-static/icons'
          total = 0
          for fname, key, icon in MAP:
              src = os.path.join(ICON_DIR, icon + '.svg')
              if not os.path.exists(src):
                  print('MISSING ICON: ' + src)
                  sys.exit(1)
              svg = open(src, encoding='utf-8').read()
              svg = svg.replace('width="24" height="24"', 'width="30" height="30"')
              svg = svg.replace('stroke-width="2"', 'stroke-width="2.75"')
              html = open(fname, encoding='utf-8').read()
              # localizar el bloque <span class="ico">…</span> que precede al <h3>…</h3>
              pat = re.compile(
                  r'(<span class="ico">.*?</span>)(\s*<h3>' + re.escape(key) + r'</h3>)',
                  re.DOTALL
              )
              m = pat.search(html)
              if not m:
                  print(f'NO MATCH: {fname} :: {key}')
                  sys.exit(1)
              html = html.replace(m.group(1), svg, 1)
              open(fname, 'w', encoding='utf-8').write(html)
              total += 1
              print(f'ok {fname} :: {key} -> {icon}')
          open('icons/_inventory.txt', 'w', encoding='utf-8').write(f'lucide inlined={total}\n')
          print('inlined=' + str(total))
          if total != 19:
              sys.exit('ERROR: expected 19 icons, inlined ' + str(total))
          PY
      - name: commit-push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aplicaciones.html defensa.html fabricacion.html ip.html tecnologia.html icons/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "iconos: 19 emoji -> Lucide en 5 paginas" && git push origin main
          fi
