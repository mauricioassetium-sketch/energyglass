name: lucide-all-once
on:
  push:
    paths:
      - '.github/workflows/lucide-all.yml'
permissions:
  contents: write
jobs:
  lucide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache lucide-static
        id: cache
        uses: actions/cache@v4
        with:
          path: /opt/lucide
          key: lucide-static-0.460.0
      - name: Install lucide-static
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          npm init -y >/dev/null 2>&1
          npm install lucide-static@0.460.0 --prefix /opt/lucide >/dev/null 2>&1
      - name: Swap emoji for Lucide SVG
        id: swap
        run: |
          set -e
          ICON_DIR="/opt/lucide/node_modules/lucide-static/icons"
          lucide() {
            local name="$1"
            sed -e 's/<svg /<svg class="ico" role="img" aria-hidden="true" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /' "$ICON_DIR/$name.svg"
          }
          inline() {
            local f="$1"; local h3="$2"; local icon="$3"
            python3 - "$f" "$h3" "$icon" <<'PYEOF'
import sys, re
f, h3, icon = sys.argv[1], sys.argv[2], sys.argv[3]
html = open(f, encoding='utf-8').read()
pat = re.compile(r'(<h3>' + re.escape(h3) + r'</h3>)')
before = html[:html.find(h3)]
# localizar el span.ico justo antes del h3
m = re.search(r'<span class="ico">[^<]*</span>\s*<h3>' + re.escape(h3), html)
if not m:
    print(f"NO MATCH {f} :: {h3}", file=sys.stderr); sys.exit(1)
new = html.replace(m.group(0), icon + '<h3>' + h3 + '</h3>', 1)
open(f, 'w', encoding='utf-8').write(new)
print(f"ok {f} :: {h3}")
PYEOF
          }
          cd "$GITHUB_WORKSPACE"
          d() { echo "\$PWD"; }
          # aplicaciones.html
          inline aplicaciones.html "Batería"       "$(lucide battery-charging)" 
          inline aplicaciones.html "Conexión a red" "$(lucide plug)"
          inline aplicaciones.html "DC directo / LED" "$(lucide lightbulb)"
          # defensa.html
          inline defensa.html "Desastres naturales" "$(lucide cloud-lightning)"
          inline defensa.html "Balística"          "$(lucide target)"
          inline defensa.html "Explosión"          "$(lucide bomb)"
          inline defensa.html "Incendios"          "$(lucide shield-alert)"
          inline defensa.html "Intrusión forzada"  "$(lucide door-open)"
          inline defensa.html "Institucional"      "$(lucide landmark)"
          # fabricacion.html
          inline fabricacion.html "Vidrios de 6 mm" "$(lucide layers)"
          inline fabricacion.html "Film de unión patentado" "$(lucide link)"
          inline fabricacion.html "Laminado y sellado" "$(lucide package)"
          # ip.html
          inline ip.html "Fórmula del interlayer" "$(lucide flask-conical)"
          inline ip.html "Film de unión"          "$(lucide link)"
          inline ip.html "Colectores de borde"    "$(lucide zap)"
          inline ip.html "Documentación"          "$(lucide file-text)"
          # tecnologia.html
          inline tecnologia.html "Dos vidrios, una película" "$(lucide layers)"
          inline tecnologia.html "Guía hacia el borde" "$(lucide route)"
          inline tecnologia.html "Colectores de borde" "$(lucide zap)"
          echo "lucide inlined=19" > icons/_inventory.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aplicaciones.html defensa.html fabricacion.html ip.html tecnologia.html icons/_inventory.txt
          git commit -m "iconos: 19 emoji -> Lucide en 5 paginas (aplicaciones, defensa, fabricacion, ip, tecnologia)" || echo "no changes"
          git push origin main
