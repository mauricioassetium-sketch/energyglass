name: lucide-icons-once
on:
  push:
    paths:
      - '.github/workflows/use-lucide.yml'
permissions:
  contents: write
jobs:
  lucide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install lucide-static
        run: npm install --no-save lucide-static@0.460.0
      - name: copy standard icons
        run: |
          set -e
          declare -A M=( [edificios]=building-2 [invernaderos]=sprout [defensa]=shield-check [tecnologia]=atom [fabricacion]=factory [propiedad]=lock )
          for k in "${!M[@]}"; do
            src="node_modules/lucide-static/icons/${M[$k]}.svg"
            if [ ! -s "$src" ]; then echo "MISSING ICON: $src"; exit 1; fi
            cp "$src" "icons/$k.svg"
          done
          echo "copied:"; ls -1 icons/
      - name: inline svgs into index.html
        run: |
          python3 - <<'PY'
          import re, sys
          s = open('index.html', encoding='utf-8').read()
          count = [0]
          def repl(m):
              path = m.group(1)
              svg = open(path, encoding='utf-8').read()
              svg = re.sub(r'width="24" height="24"', 'width="30" height="30"', svg)
              svg = re.sub(r'stroke-width="2"', 'stroke-width="2.75"', svg)
              count[0] += 1
              return svg
          nuevo = re.sub(r'<img src="(icons/[^"]+\.svg)"[^>]*>', repl, s)
          open('index.html', 'w', encoding='utf-8').write(nuevo)
          open('icons/_inventory.txt', 'w', encoding='utf-8').write('lucide inlined=%d\n' % count[0])
          print('inlined=%d' % count[0])
          if count[0] != 6:
              sys.exit('ERROR: expected 6 icons, inlined %d' % count[0])
          PY
          grep -c '</html>' index.html
          wc -c index.html
      - name: css-for-inline-svg
        run: |
          printf '\n/* lucide icons inline */\n.ico svg{width:30px;height:30px;display:block}\n' >> style.css
      - name: commit-push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css icons/
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "iconos: reemplazar disenos propios por Lucide estandar (building-2, sprout, shield-check, atom, factory, lock)"; git push; fi
