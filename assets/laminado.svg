<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" fill="none" role="img" aria-label="Sección transversal del laminado EnergyGlass con sus cinco capas y el camino de la luz">
  <defs>
    <linearGradient id="lg-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0fb8a6" stop-opacity=".28"/>
      <stop offset="1" stop-color="#0b7a5c" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="lg-inter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b23b" stop-opacity=".42"/>
      <stop offset="1" stop-color="#e09e1f" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="lg-colect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d6b86"/>
      <stop offset="1" stop-color="#0a4457"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#ffffff"/>

  <!-- marco / sellado exterior -->
  <rect x="70" y="150" width="860" height="220" rx="10" fill="#f0f5f4" stroke="#0a3d31" stroke-width="3"/>

  <!-- luz solar entrante (arriba) -->
  <g stroke="#f2b23b" stroke-width="4" stroke-linecap="round">
    <line x1="160" y1="24" x2="160" y2="150">
      <animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/>
    </line>
    <line x1="330" y1="24" x2="330" y2="150">
      <animate attributeName="opacity" values=".5;1;.5" dur="2.4s" repeatCount="indefinite"/>
    </line>
    <line x1="500" y1="24" x2="500" y2="150">
      <animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/>
    </line>
    <line x1="670" y1="24" x2="670" y2="150">
      <animate attributeName="opacity" values=".5;1;.5" dur="2.4s" repeatCount="indefinite"/>
    </line>
    <line x1="840" y1="24" x2="840" y2="150">
      <animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- capa 1: vidrio exterior (arriba) -->
  <rect x="70" y="150" width="860" height="52" rx="8" fill="url(#lg-glass)" stroke="#0b7a5c" stroke-width="2"/>

  <!-- capa 2: interlayer (medio, ámbar) -->
  <rect x="70" y="202" width="860" height="68" fill="url(#lg-inter)" stroke="#e09e1f" stroke-width="2"/>

  <!-- capa 3: vidrio interior (abajo) -->
  <rect x="70" y="270" width="860" height="52" rx="8" fill="url(#lg-glass)" stroke="#0b7a5c" stroke-width="2"/>

  <!-- capa 4: colectores de borde (izq y der) -->
  <rect x="70" y="150" width="26" height="220" rx="6" fill="url(#lg-colect)"/>
  <rect x="904" y="150" width="26" height="220" rx="6" fill="url(#lg-colect)"/>

  <!-- capa 5: sellado (marco fino que envuelve) -->
  <rect x="58" y="142" width="884" height="236" rx="16" fill="none" stroke="#0a3d31" stroke-width="6"/>

  <!-- fotones redirigidos hacia los bordes -->
  <g fill="#f2b23b">
    <circle cx="300" cy="236" r="7">
      <animate attributeName="cx" values="300;150;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="236;236;236" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="236" r="7">
      <animate attributeName="cx" values="500;400;96" dur="3.2s" begin=".4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" dur="3.2s" begin=".4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="236" r="7">
      <animate attributeName="cx" values="600;750;904" dur="3.2s" begin=".8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" dur="3.2s" begin=".8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="236" r="7">
      <animate attributeName="cx" values="400;250;904" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- corriente saliendo de los colectores hacia el inversor -->
  <g stroke="#f2b23b" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M96 370 L96 470 L330 470">
      <animate attributeName="stroke-dashoffset" values="0;-60;0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M904 370 L904 470 L670 470">
      <animate attributeName="stroke-dashoffset" values="0;-60;0" dur="2s" begin=".5s" repeatCount="indefinite"/>
    </path>
  </g>
  <rect x="300" y="458" width="260" height="40" rx="6" fill="#0a3d31"/>
  <text x="430" y="484" text-anchor="middle" fill="#ffffff" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700">CC → inversor</text>

  <!-- etiquetas de capas -->
  <g font-family="Helvetica,Arial,sans-serif" fill="#12212b">
    <text x="930" y="182" font-size="15" font-weight="700" fill="#0b7a5c">1 · Vidrio exterior</text>
    <text x="930" y="182" font-size="13" fill="#5a6b72" dy="20">alta transmisión</text>

    <text x="930" y="248" font-size="15" font-weight="700" fill="#e09e1f">2 · Interlayer</text>
    <text x="930" y="248" font-size="13" fill="#5a6b72" dy="20">nanopartículas guía-luz</text>

    <text x="930" y="308" font-size="15" font-weight="700" fill="#0b7a5c">3 · Vidrio interior</text>
    <text x="930" y="308" font-size="13" fill="#5a6b72" dy="20">seguridad pasiva</text>

    <text x="930" y="372" font-size="15" font-weight="700" fill="#1d6b86">4 · Colectores de borde</text>
    <text x="930" y="372" font-size="13" fill="#5a6b72" dy="20">luz → corriente CC</text>

    <text x="930" y="420" font-size="15" font-weight="700" fill="#0a3d31">5 · Sellado</text>
    <text x="930" y="420" font-size="13" fill="#5a6b72" dy="20">humedad + térmica</text>
  </g>
</svg>
