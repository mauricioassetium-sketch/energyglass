<line x1="41" y1="41" x2="61" y2="61" stroke="#ffd64d" stroke-width="3" stroke-linecap="round"/>
<line x1="0" y1="58" x2="0" y2="86" stroke="#ffd64d" stroke-width="3" stroke-linecap="round"/>
