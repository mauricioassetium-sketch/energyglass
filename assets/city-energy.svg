<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Skyline de mega-ciudad con vidrio que genera energía">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#f3faf9"/><stop offset="1" stop-color="#ffffff"/>
</linearGradient>
<linearGradient id="winA" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#b8e6e0"/><stop offset="1" stop-color="#e9f7f5"/>
</linearGradient>
<linearGradient id="winB" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#cdeff0"/><stop offset="1" stop-color="#a7dcd6"/>
</linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#13e0c5" stop-opacity=".55"/>
<stop offset=".55" stop-color="#00B09B" stop-opacity=".7"/>
<stop offset="1" stop-color="#00c04a" stop-opacity=".35"/>
</linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#dfecea"/><stop offset="1" stop-color="#c2d4d1"/>
</linearGradient>
<radialGradient id="sun" cx=".5" cy=".5" r=".5">
<stop offset="0" stop-color="#fff8d9"/><stop offset=".55" stop-color="#ffe98a"/><stop offset="1" stop-color="#ffd64d" stop-opacity="0"/>
</radialGradient>
<filter id="blur2"><feGaussianBlur stdDeviation="2.4"/></filter>
</defs>

<rect width="1200" height="520" fill="url(#sky)"/>

<!-- sol con rayos rotando -->
<g class="sun-rays" transform="translate(1030 96)">
