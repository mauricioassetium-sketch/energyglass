<line x1="-58" y1="0" x2="-86" y2="0" stroke="#ffd64d" stroke-width="3" stroke-linecap="round"/>
<line x1="-41" y1="-41" x2="-61" y2="-61" stroke="#ffd64d" stroke-width="3" stroke-linecap="round"/>
</g>
<circle class="sun-core" r="34" fill="url(#sun)"/>
