<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Skyline urbano EnergyGlass: el sol alimenta el vidrio que genera energía">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef8f7"/><stop offset=".62" stop-color="#fbfefe"/><stop offset="1" stop-color="#e7f4f2"/>
    </linearGradient>
    <linearGradient id="sunG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#f2a93b"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff3ef"/><stop offset=".5" stop-color="#a9ddd6"/><stop offset="1" stop-color="#5fc3b6"/>
    </linearGradient>
    <linearGradient id="glass2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c3e6ef"/><stop offset="1" stop-color="#7fcdd4"/>
    </linearGradient>
    <linearGradient id="glass3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8f0e2"/><stop offset="1" stop-color="#a8d9a0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0"/><stop offset=".5" stop-color="#ffd27a" stop-opacity=".6"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="1200" height="460" fill="url(#sky)"/>

  <!-- sol: halo + disco + rayos que rotan -->
  <circle cx="1030" cy="96" r="108" fill="url(#glow)"/>
  <g transform="translate(1030 96)">
    <circle r="40" fill="url(#sunG)"/>
    <g stroke="#f2a93b" stroke-linecap="round">
      <g class="rays" style="transform-origin:1030px 96px">
        <line x1="52" y1="0" x2="78" y2="0" stroke-width="1"/>
        <line x1="-52" y1="0" x2="-78" y2="0" stroke-width="1"/>
        <line x1="0" y1="-52" x2="0" y2="-78" stroke-width="1"/>
        <line x1="0" y1="52" x2="0" y2="78" stroke-width="1"/>
        <line x1="30" y1="-42" x2="46" y2="-64" stroke-width=".8"/>
        <line x1="-30" y1="42" x2="-46" y2="64" stroke-width=".8"/>
        <line x1="-38" y1="-34" x2="-58" y2="-52" stroke-width=".8"/>
        <line x1="38" y1="34" x2="58" y2="52" stroke-width=".8"/>
        <line x1="16" y1="-49" x2="26" y2="-80" stroke-width=".6"/>
        <line x1="-16" y1="49" x2="-26" y2="80" stroke-width=".6"/>
      </g>
    </g>
  </g>

  <!-- haces de luz que viajan del sol al vidrio -->
  <g stroke="#f6c96b" stroke-linecap="round" opacity=".5">
    <line class="beam1" x1="980" y1="130" x2="560" y2="225" stroke-width="1.4"/>
    <line class="beam2" x1="990" y1="90" x2="470" y2="185" stroke-width="1"/>
    <line class="beam3" x1="975" y1="150" x2="640" y2="265" stroke-width="1"/>
  </g>
  <g fill="#ffdc94">
    <circle class="ph1" r="2.4"><animateMotion dur="3.2s" repeatCount="indefinite" path="M980 130 L560 225"/></circle>
    <circle class="ph2" r="1.8"><animateMotion dur="3.8s" repeatCount="indefinite" path="M990 90 L470 185"/></circle>
    <circle class="ph3" r="2"><animateMotion dur="2.7s" repeatCount="indefinite" path="M975 150 L640 265"/></circle>
  </g>

  <!-- capa lejana (siluetas finas, baja opacidad) -->
  <g fill="#cfe4e2" opacity=".55">
    <rect x="40" y="250" width="46" height="210"/>
    <rect x="120" y="205" width="58" height="255"/>
    <rect x="215" y="230" width="40" height="230"/>
    <rect x="700" y="240" width="48" height="220"/>
    <rect x="800" y="195" width="60" height="265"/>
    <rect x="900" y="235" width="42" height="225"/>
    <rect x="1080" y="220" width="52" height="240"/>
    <rect x="1150" y="255" width="40" height="205"/>
  </g>
  <g stroke="#bfdcd8" stroke-width=".7" opacity=".5">
    <line x1="120" y1="225" x2="178" y2="225"/><line x1="120" y1="255" x2="178" y2="255"/>
    <line x1="800" y1="215" x2="860" y2="215"/><line x1="800" y1="245" x2="860" y2="245"/>
  </g>

  <!-- capa media: torres de vidrio con muros cortina -->
  <g>
    <!-- edificio izquierdo -->
    <rect x="330" y="188" width="120" height="272" fill="url(#glass1)" stroke="#7fbdb3" stroke-width=".7"/>
    <g stroke="#8ed2c8" stroke-width=".6" opacity=".7">
      <line x1="330" y1="220" x2="450" y2="220"/><line x1="330" y1="260" x2="450" y2="260"/>
      <line x1="330" y1="300" x2="450" y2="300"/><line x1="330" y1="340" x2="450" y2="340"/>
      <line x1="330" y1="380" x2="450" y2="380"/><line x1="330" y1="420" x2="450" y2="420"/>
    </g>
    <g stroke="#7fbfb4" stroke-width=".6" opacity=".6">
      <line x1="370" y1="188" x2="370" y2="460"/><line x1="410" y1="188" x2="410" y2="460"/>
    </g>
    <!-- torre central (energía ascendente) -->
    <rect x="475" y="120" width="96" height="340" fill="url(#glass2)" stroke="#6cb6d0" stroke-width=".7"/>
    <g stroke="#9adce4" stroke-width=".6" opacity=".7">
      <line x1="475" y1="160" x2="571" y2="160"/><line x1="475" y1="200" x2="571" y2="200"/>
      <line x1="475" y1="240" x2="571" y2="240"/><line x1="475" y1="280" x2="571" y2="280"/>
      <line x1="475" y1="320" x2="571" y2="320"/><line x1="475" y1="360" x2="571" y2="360"/>
      <line x1="475" y1="400" x2="571" y2="400"/>
    </g>
    <line x1="523" y1="120" x2="523" y2="460" stroke="#85c9d4" stroke-width=".6" opacity=".6"/>
    <!-- fotones subiendo por la torre central (generación) -->
    <g fill="#0fb9a8">
      <circle r="2.6"><animate attributeName="cy" values="440;150;440" dur="4.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle r="2"><animate attributeName="cy" values="430;160;430" dur="5s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="5s" begin="1s" repeatCount="indefinite"/></circle>
      <circle r="2.3"><animate attributeName="cy" values="435;140;435" dur="3.6s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="3.6s" begin="2s" repeatCount="indefinite"/></circle>
    </g>
    <!-- edificio derecho -->
    <rect x="595" y="215" width="130" height="245" fill="url(#glass3)" stroke="#82c08c" stroke-width=".7"/>
    <g stroke="#a9d9a1" stroke-width=".6" opacity=".7">
      <line x1="595" y1="250" x2="725" y2="250"/><line x1="595" y1="295" x2="725" y2="295"/>
      <line x1="595" y1="340" x2="725" y2="340"/><line x1="595" y1="385" x2="725" y2="385"/>
    </g>
    <line x1="660" y1="215" x2="660" y2="460" stroke="#95c897" stroke-width=".6" opacity=".6"/>
  </g>

  <!-- destellos en las ventanas (luz que se refleja) -->
  <g fill="#ffffff" opacity=".8">
    <rect class="glint" x="382" y="215" width="8" height="3" rx="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></rect>
    <rect class="glint" x="500" y="175" width="10" height="3" rx="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="3.6s" begin="1s" repeatCount="indefinite"/></rect>
    <rect class="glint" x="620" y="265" width="9" height="3" rx="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" begin="2s" repeatCount="indefinite"/></rect>
  </g>

  <!-- suelo / línea base -->
  <rect x="0" y="460" width="1200" height="0"/>

  <style>
    .rays{animation:rot 30s linear infinite}
    @keyframes rot{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.rays,.beam1,.beam2,.beam3,.ph1,.ph2,.ph3{animation:none}}
  </style>
</svg>
