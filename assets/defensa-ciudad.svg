<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" class="definite-ciudad" role="img" aria-label="Ciudad protegida por el proemi SAF-GLAS">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0b1e2c"/>
    <stop offset=".6" stop-color="#152b3a"/>
    <stop offset="1" stop-color="#2c4860"/>
  </linearGradient>
  <linearGradient id="shield" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0fb9a8"/>
    <stop offset="1" stop-color="#2f8e90"/>
  </linearGradient>
  <radialGradient id="flash">
    <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
    <stop offset="1" stop-color="#0fb9a8" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="1060" cy="86" r="34" fill="#fde760"/>
<circle cx="1060" cy="86" r="50" fill="#fde760" opacity=".2"/>

<!-- edificios -->
<g fill="#1c29381">
  <rect x="60" y="360" width="70" height="220"/>
  <rect x="150" y="320" width="60" height="260"/>
  <rect x="230" y="380" width="70" height="200"/>
  <rect x="320" y="300" width="80" height="280"/>
  <rect x="420" y="350" width="60" height="230"/>
  <rect x="500" y="340" width="70" height="240"/>
  <rect x="590" y="370" width="60" height="210"/>
  <rect x="670" y="320" width="70" height="260"/>
  <rect x="760" y="340" width="60" height="240"/>
  <rect x="850" y="360" width="70" height="220"/>
  <rect x="940" y="300" width="70" height="280"/>
  <rect x="1030" y="350" width="60" height="230"/>
</g>

<!-- ventanas iluminadas *-->
<g fill="#e9f5d9" opacity=".8">
  <circle cx="180" cy="380" r="6"/><circle cx="180" cy="420" r="6"/>
  <circle cx="360" cy="360" r="7"/><circle cx="360" cy="400" r="7"/><circle cx="360" cy="440" r="7"/>
  <circle cx="530" cy="400" r="6"/><circle cx="530" cy="440" r="6"/>
  <circle cx="700" cy="380" r="6"/><circle cx="700" cy="420" r="6"/><circle cx="700" cy="460" r="6"/>
  <circle cx="970" cy="360" r="7"/><circle cx="970" cy="400" r="7"/><circle cx="970" cy="440" r="7"/>
  <circle cx="1060" cy="400" r="6"/>
</g>

<!-- suelo -->
<rect x="0" y="580" width="1200" height="95" fill="#09151d"/>

<!-- misiles que lllegan -->
<g stroke="#fff4c0" stroke-width="4" fill="none" stroke-linecap="round">
  <path class="missile" d="M600 12 L680 260">
    <polygon fill="#fff4a0" points="680,260 670,240 690,250"/>
  </path>
  <path class="missile m2" d="M760 40 L700 270">
    <polygon fill="#fff4a0" points="700,270 690,250 710,260"/>
  </path>
  <path class="missile m3" d="M380 20 L440 240">
    <polygon fill="#fff4a0" points="440,240 430,220 450,230"/>
  </path>
</g>

<!-- proemi SAF-GLAS --->
<path class="shieldline" d="M600 61 L440 340 L600 615 L760 340 Z" fill="url(#shield)" stroke="#bde7eb" stroke-width="3" opacity=".9"/>
<path d="M600 150 L470 340 L600 530 L730 340 Z" fill="none" stroke="#309ea9" stroke-width="4" opacity=".55"/>

<!-- destellos -->
<circle class="flash1" cx="670" cy="320" r="22" fill="url(#flash)"/>
<circle class="flash2" cx="690" cy="350" r="16" fill="url(#flash)"/>
<circle class="flash3" cx="450" cy="300" r="18" fill="url(#flash)"/>

</svg>
